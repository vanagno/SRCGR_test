name: Validate, build and deploy geobrowser

# Pull requests: run the tests and a full build (schema, formats, placeholder
# guard, event matching) without deploying anything.
# Pushes to main and manual runs on main: the same checks, then publish dist/
# (index.html + data/) to GitHub Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs of the same pull request are cancelled; runs on main are
# queued, never cancelled mid-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Validate models and build site
        run: python build.py

      - name: Check that event_registry.json is up to date
        run: |
          if [ -n "$(git status --porcelain -- event_registry.json)" ]; then
            echo "::warning file=event_registry.json::event_registry.json changed during the build (new or re-assigned model files). Run 'python build.py' locally and commit event_registry.json so earthquake keys stay stable."
            git --no-pager diff --stat -- event_registry.json
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
